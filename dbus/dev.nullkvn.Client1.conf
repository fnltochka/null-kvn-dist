<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the root-owned system service may claim the privileged name. -->
  <policy user="root">
    <allow own="dev.nullkvn.Client1"/>
  </policy>

  <!-- The daemon makes the final per-method polkit decision. -->
  <policy context="default">
    <allow send_destination="dev.nullkvn.Client1"
           send_type="method_call"/>
  </policy>
</busconfig>
